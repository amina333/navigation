apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: skyguide
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/amina333/navigation.git
    targetRevision: main
    path: deploy/k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: navigation-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
