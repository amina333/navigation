apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# No namePrefix: service names (skyguide-postgres, skyguide-minio,
# skyguide-backend) are hard-coded in env vars, initContainers and nginx.conf.
labels:
  - pairs:
      environment: dev
    includeSelectors: false

patches:
  - path: patches/backend-replicas.yaml
  - path: patches/frontend-replicas.yaml
