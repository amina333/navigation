apiVersion: apps/v1
kind: Deployment
metadata:
  name: skyguide-backend
  namespace: skyguide
  labels:
    app: skyguide-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skyguide-backend
  template:
    metadata:
      labels:
        app: skyguide-backend
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z skyguide-postgres 5432; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
        - name: wait-for-minio
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z skyguide-minio 9000; do
                echo "Waiting for MinIO..."
                sleep 2
              done
              echo "MinIO is ready!"
      containers:
        - name: backend
          image: skyguide-backend:latest
          # Image is built on the VM and imported into containerd (k8s.io namespace)
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://$(DB_HOST):$(DB_PORT)/$(DB_NAME)
            - name: MINIO_ENDPOINT
              value: http://skyguide-minio:9000
          # /api/auth/signin is a POST endpoint -> GET probes returned 4xx.
          # TCP probes only check that Spring Boot is listening on 8081.
          startupProbe:
            tcpSocket:
              port: 8081
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 8081
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8081
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
