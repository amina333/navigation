apiVersion: v1
kind: Service
metadata:
  name: skyguide-frontend
  namespace: skyguide
  labels:
    app: skyguide-frontend
spec:
  selector:
    app: skyguide-frontend
  ports:
    - port: 80
      targetPort: 80
      # Port fixe : l'application reste sur http://<IP de la VM>:31601 même après reconstruction
      nodePort: 31601
  type: NodePort
