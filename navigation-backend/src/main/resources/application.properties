spring.application.name=navigation-backend
server.port=${SERVER_PORT:8081}

# ============================================================
# DATABASE - PostgreSQL (override via env vars in K8s)
# ============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/navigation_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# ============================================================
# LOGGING
# ============================================================
logging.level.root=INFO
logging.level.com.air.navigation=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %level - %logger{60} %msg %n

# ============================================================
# JWT
# ============================================================
nav.app.jwtSecret=${JWT_SECRET:M2NmYTc2ZWYxNDkzN2MxYzBlYTE5MWY4ZmMwNTdhODBmY2QwNGE3NDIwZjhlOGJjZDBhNzU2N2MyNzJlMDA3Yg==}
nav.app.jwtExpirationMs=${JWT_EXPIRATION:86400000}

# ============================================================
# SWAGGER / OPENAPI
# ============================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ============================================================
# WEBSOCKET
# ============================================================
spring.websocket.message-size=64000

