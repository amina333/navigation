spring.application.name=navigation-backend
server.port=${SERVER_PORT:8081}

# Paramètres locaux et secrets (SMTP…) : fichier NON versionné à côté du pom.xml
# Copier mail.local.properties.example en mail.local.properties et le remplir.
spring.config.import=optional:file:./mail.local.properties

# ============================================================
# DATABASE - PostgreSQL (override via env vars in K8s)
# ============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/navigation_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# ============================================================
# LOGGING
# ============================================================
logging.level.root=INFO
logging.level.com.air.navigation=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %level - %logger{60} %msg %n

# ============================================================
# JWT
# ============================================================
nav.app.jwtSecret=${JWT_SECRET:M2NmYTc2ZWYxNDkzN2MxYzBlYTE5MWY4ZmMwNTdhODBmY2QwNGE3NDIwZjhlOGJjZDBhNzU2N2MyNzJlMDA3Yg==}
nav.app.jwtExpirationMs=${JWT_EXPIRATION:86400000}

# ============================================================
# SWAGGER / OPENAPI
# ============================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ============================================================
# WEBSOCKET
# ============================================================
spring.websocket.message-size=64000

# ============================================================
# SPRING AI - OpenAI (ChatGPT)
# ============================================================
# Si OPENAI_API_KEY n'est pas defini, le backend demarre quand meme
# et SkyAI utilise le moteur de regles metier (fallback).
spring.ai.openai.api-key=${OPENAI_API_KEY:not-configured}
spring.ai.openai.chat.options.model=gpt-4o-mini

# ============================================================
# ============================================================

# Upload fichiers chat

# MINIO - Stockage fichiers chat Section 8.7
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:skyguide-chat}

# Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=250MB

# ============================================================
# MAILING (bienvenue, identifiants, code de réinitialisation)
# Sans MAIL_USERNAME, les e-mails sont enregistrés en HTML dans ./mail-outbox
# Gmail / Google Workspace : MAIL_HOST=smtp.gmail.com, MAIL_PORT=587,
#   MAIL_PASSWORD = mot de passe d'application (16 lettres), PAS le mot de passe du compte
# Outlook / Microsoft 365 : MAIL_HOST=smtp.office365.com, MAIL_PORT=587
# ============================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${MAIL_FROM:}
app.mail.from-name=${MAIL_FROM_NAME:Skyguide Navigation · OACA}
app.mail.outbox-dir=${MAIL_OUTBOX:mail-outbox}
app.frontend-url=${FRONTEND_URL:http://localhost:4200}
app.reset.code-validity-minutes=15

# ============================================================
# Admin Init (override via env vars in K8s)
# ============================================================
app.init.admin.email=${ADMIN_EMAIL:admin@navigation.tn}
app.init.admin.password=${ADMIN_PASSWORD:Admin@1234}
app.init.admin.firstName=${ADMIN_FIRST_NAME:Super}
app.init.admin.lastName=${ADMIN_LAST_NAME:Admin}
app.init.admin.matricule=${ADMIN_MATRICULE:ADM-001}
