spring.application.name=navigation-backend
server.port=8081

# ============================================================
# DATABASE - PostgreSQL
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/navigation_db
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

# ============================================================
# LOGGING
# ============================================================
logging.level.root=INFO
logging.level.com.air.navigation=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %level - %logger{60} %msg %n

