<!-- ══════════════════════════════════════════
   AI ASSISTANT — FAB + CHAT WINDOW
══════════════════════════════════════════ -->

<!-- Chat Window -->
<div class="chat-window" [class.open]="isOpen" role="dialog" aria-label="Assistant IA">

  <!-- Header -->
  <div class="chat-header">
    <div class="header-info">
      <div class="ai-avatar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 8v4M12 16h.01"/>
        </svg>
      </div>
      <div>
        <div class="ai-name">SkyAI</div>
        <div class="ai-status">
          <span class="status-dot"></span> En ligne
        </div>
      </div>
    </div>
    <div class="header-actions">
      <button class="hdr-btn" (click)="clearChat()" title="Effacer la conversation">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a1 1 0 011-1h4a1 1 0 011 1v2"/>
        </svg>
      </button>
      <button class="hdr-btn" (click)="closeChat()" title="Fermer">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Messages -->
  <div class="messages-area" #messagesContainer>

    <div *ngFor="let msg of messages"
         class="message-row"
         [class.user-row]="msg.role === 'user'"
         [class.assistant-row]="msg.role === 'assistant'">

      <div class="msg-avatar" *ngIf="msg.role === 'assistant'">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 8v4M12 16h.01"/>
        </svg>
      </div>

      <div class="msg-bubble" [class.user-bubble]="msg.role === 'user'" [class.ai-bubble]="msg.role === 'assistant'">
        <div class="msg-content">{{ msg.content }}</div>
        <div class="msg-time">{{ msg.timestamp | date:'HH:mm' }}</div>
      </div>

    </div>

    <!-- Typing indicator -->
    <div class="message-row assistant-row" *ngIf="isTyping">
      <div class="msg-avatar">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
        </svg>
      </div>
      <div class="msg-bubble ai-bubble typing-bubble">
        <span></span><span></span><span></span>
      </div>
    </div>

  </div>

  <!-- Input -->
  <div class="chat-input-area">
    <textarea
      [(ngModel)]="userInput"
      (keydown)="onKeydown($event)"
      placeholder="Posez votre question..."
      rows="1"
      class="chat-input"
      [disabled]="isTyping">
    </textarea>
    <button class="send-btn" (click)="sendMessage()" [disabled]="!userInput.trim() || isTyping" title="Envoyer (Entrée)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>

</div>

<!-- FAB Button -->
<button class="fab-btn" (click)="toggleChat()" [title]="isOpen ? 'Fermer l\'assistant' : 'Assistant IA SkyAI'" [class.active]="isOpen">
  <span class="fab-icon fab-open" [class.hidden]="isOpen">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
      <circle cx="9" cy="10" r="1" fill="currentColor"/><circle cx="12" cy="10" r="1" fill="currentColor"/><circle cx="15" cy="10" r="1" fill="currentColor"/>
    </svg>
  </span>
  <span class="fab-icon fab-close" [class.hidden]="!isOpen">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  </span>
  <span class="fab-pulse" *ngIf="!isOpen"></span>
</button>
