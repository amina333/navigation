<div class="notification-bell-container">
  <!-- Notification Bell -->
  <button class="notification-bell" (click)="toggleDropdown()" [class.has-notifications]="unreadCount > 0">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
    </svg>
    
    <!-- Notification Badge -->
    <span class="notification-badge" *ngIf="unreadCount > 0" [class.multiple]="unreadCount > 9">
      {{ unreadCount > 99 ? '99+' : unreadCount }}
    </span>
    
    <!-- Pulse Animation for New Notifications -->
    <div class="pulse-ring" *ngIf="hasNewNotifications"></div>
  </button>

  <!-- Notifications Dropdown -->
  <div class="notifications-dropdown" [class.show]="showDropdown" [@dropdownAnimation]="showDropdown ? 'open' : 'closed'">
    <div class="dropdown-header">
      <h3>Notifications</h3>
      <div class="header-actions">
        <button class="btn-text" (click)="markAllAsRead()" [disabled]="unreadCount === 0">
          Tout marquer comme lu
        </button>
        <button class="btn-text" (click)="openSettings()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 1v6m0 6v6m4.22-13.22l4.24 4.24M1.54 9.96l4.24 4.24M1.54 14.04l4.24-4.24M18.46 14.04l4.24-4.24"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Filter Tabs -->
    <div class="filter-tabs">
      <button class="tab-btn" [class.active]="activeFilter === 'all'" (click)="activeFilter = 'all'">
        Toutes
      </button>
      <button class="tab-btn" [class.active]="activeFilter === 'unread'" (click)="activeFilter = 'unread'">
        Non lues
      </button>
      <button class="tab-btn" [class.active]="activeFilter === 'flights'" (click)="activeFilter = 'flights'">
        Vols
      </button>
      <button class="tab-btn" [class.active]="activeFilter === 'system'" (click)="activeFilter = 'system'">
        Système
      </button>
    </div>

    <!-- Notifications List -->
    <div class="notifications-list">
      <div class="loading-state" *ngIf="loading">
        <div class="loading-spinner"></div>
        <span>Chargement...</span>
      </div>

      <div class="empty-state" *ngIf="!loading && filteredNotifications.length === 0">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <h4>Aucune notification</h4>
        <p>{{ activeFilter === 'unread' ? 'Aucune notification non lue' : 'Vous êtes à jour' }}</p>
      </div>

      <div class="notification-item" 
           *ngFor="let notification of filteredNotifications" 
           [class.unread]="!notification.read"
           [class]="getNotificationClass(notification.type)"
           (click)="handleNotificationClick(notification)">
        
        <!-- Notification Icon -->
        <div class="notification-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <!-- Flight Icon -->
            <g *ngIf="notification.type === 'FLIGHT'">
              <path d="M22 2L11 13"/>
              <path d="M22 2l-7 20-4-9-9-4 20-7z"/>
            </g>
            <!-- System Icon -->
            <g *ngIf="notification.type === 'SYSTEM'">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="12"/>
              <line x1="12" y1="16" x2="12.01" y2="16"/>
            </g>
            <!-- User Icon -->
            <g *ngIf="notification.type === 'USER'">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </g>
            <!-- Message Icon -->
            <g *ngIf="notification.type === 'MESSAGE'">
              <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
            </g>
            <!-- Alert Icon -->
            <g *ngIf="notification.type === 'ALERT'">
              <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
              <line x1="12" y1="9" x2="12" y2="13"/>
              <line x1="12" y1="17" x2="12.01" y2="17"/>
            </g>
          </svg>
        </div>

        <!-- Notification Content -->
        <div class="notification-content">
          <div class="notification-header">
            <h4 class="notification-title">{{ notification.title }}</h4>
            <span class="notification-time">{{ formatTime(notification.createdAt) }}</span>
          </div>
          <p class="notification-message">{{ notification.message }}</p>
          <div class="notification-actions" *ngIf="notification.actions && notification.actions.length > 0">
            <button *ngFor="let action of notification.actions" 
                    class="action-btn"
                    [class]="action.type"
                    (click)="executeAction(action, notification, $event)">
              {{ action.label }}
            </button>
          </div>
        </div>

        <!-- Unread Indicator -->
        <div class="unread-indicator" *ngIf="!notification.read"></div>
      </div>
    </div>

    <!-- Footer -->
    <div class="dropdown-footer">
      <button class="btn-text" (click)="viewAllNotifications()">
        Voir toutes les notifications
      </button>
    </div>
  </div>

  <!-- Backdrop -->
  <div class="dropdown-backdrop" 
       *ngIf="showDropdown" 
       (click)="closeDropdown()"
       @backdropAnimation>
  </div>
</div>
