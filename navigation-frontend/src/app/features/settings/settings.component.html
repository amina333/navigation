<div class="settings-page">
  <div class="settings-header">
    <h1>Paramètres</h1>
    <p>Gérez les paramètres de l'application et du système</p>
  </div>

  <div class="settings-content">
    <div class="settings-section">
      <h3>Paramètres généraux</h3>
      <div class="setting-item">
        <label>Nom de l'application</label>
        <input type="text" value="SkyControl Navigation" disabled>
      </div>
      <div class="setting-item">
        <label>Version</label>
        <input type="text" value="1.0.0" disabled>
      </div>
    </div>

    <div class="settings-section">
      <h3>Préférences système</h3>
      <div class="setting-item">
        <label>Langue</label>
        <select>
          <option>Français</option>
          <option>English</option>
        </select>
      </div>
      <div class="setting-item">
        <label>Fuseau horaire</label>
        <select>
          <option>Europe/Paris</option>
          <option>UTC</option>
        </select>
      </div>
    </div>

    <div class="settings-section">
      <h3>Notifications</h3>
      <div class="setting-item">
        <label>Notifications par email</label>
        <input type="checkbox" checked>
      </div>
      <div class="setting-item">
        <label>Notifications du navigateur</label>
        <input type="checkbox" checked>
      </div>
      <div class="setting-item">
        <label>Sons de notification</label>
        <input type="checkbox" checked>
      </div>
    </div>

    <div class="settings-section">
      <h3>Sécurité</h3>
      <div class="setting-item">
        <label>Authentification à deux facteurs</label>
        <input type="checkbox">
      </div>
      <div class="setting-item">
        <label>Session automatique</label>
        <select>
          <option>30 minutes</option>
          <option>1 heure</option>
          <option>Jamais</option>
        </select>
      </div>
    </div>
  </div>
</div>
